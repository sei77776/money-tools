<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  /* OGP画像 1200x630。サイトのデザイントークン（Trust navy + premium gold）を使用 */
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    background: linear-gradient(135deg, #F8FAFC 55%, #E8EEF9);
    color: #0F172A;
    display: flex; flex-direction: column; justify-content: center;
    padding: 72px 80px;
    position: relative; overflow: hidden;
  }
  .gold-bar { position: absolute; top: 0; left: 0; right: 0; height: 10px;
    background: linear-gradient(90deg, #1E3A8A, #A16207); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; color: #1E3A8A; }
  h1 { font-size: 64px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em; margin: 28px 0 20px; }
  h1 .gold { color: #A16207; }
  p { font-size: 30px; color: #64748B; line-height: 1.5; }
  .chips { display: flex; gap: 16px; margin-top: 40px; }
  .chip { background: #fff; border: 2px solid #E2E8F0; border-radius: 999px;
    padding: 14px 30px; font-size: 26px; font-weight: 700; color: #1E3A8A; }
  .free { position: absolute; right: 80px; top: 64px; background: #A16207; color: #fff;
    border-radius: 999px; padding: 14px 32px; font-size: 28px; font-weight: 800; }
</style>
</head>
<body>
  <div class="gold-bar"></div>
  <div class="free">無料・登録不要</div>
  <div class="brand">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#A16207" stroke-width="2" stroke-linecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11.01"/><line x1="12" y1="11" x2="12" y2="11.01"/><line x1="16" y1="11" x2="16" y2="11.01"/></svg>
    お金の制度計算ツール
  </div>
  <h1>2026年の制度変更、<br><span class="gold">自分の数字</span>は3入力でわかる。</h1>
  <p>178万円の壁・週20時間の新ルール・ふるさと納税の上限額。<br>2026年（令和8年）対応の無料シミュレーター。</p>
  <div class="chips">
    <span class="chip">年収の壁・手取り</span>
    <span class="chip">ふるさと納税上限額</span>
    <span class="chip">寄付管理＋期限アラート</span>
  </div>
</body>
</html>
