name: Fetch Search Console data

on:
  schedule:
    # 毎週月曜 06:00 JST（日曜 21:00 UTC）。週次の収益改善ループ（月曜9時 JST）の前に実行
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 鍵レス認証（Workload Identity連携）: このリポジトリのActionsだけが
      # gsc-reader として認証できる。サービスアカウント鍵は存在しない
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/570383896091/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: gsc-reader@saas-505209.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
      - name: Fetch search analytics
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/fetch-gsc.mjs
      - name: Commit data
        run: |
          git config user.name "gsc-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gsc || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: Search Consoleの週次データを更新"
          git push
